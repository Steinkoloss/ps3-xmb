# Builds ps3-xmb-installer.run on the oldest supported base (Ubuntu 26.04 LTS: its Qt and
# glibc are the minimum the installer needs) and attaches it to the release for a v* tag.
name: Installer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            qt6-base-dev qt6-declarative-dev libgl-dev libopengl-dev
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target moyou-qml
      - name: Package
        run: native/package/make-installer.sh build ps3-xmb-installer.run
      - uses: actions/upload-artifact@v4
        with:
          name: ps3-xmb-installer
          path: ps3-xmb-installer.run
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ps3-xmb-installer.run
